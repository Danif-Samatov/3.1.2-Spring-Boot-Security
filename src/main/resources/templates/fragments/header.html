<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="header">
    <a th:href="@{/}">Главная</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Админ</a>
    <a sec:authorize="hasAnyRole('ADMIN', 'USER')" th:href="@{/user}">Моя страница</a>
    <a sec:authorize="isAnonymous()" th:href="@{/login}">Войти</a>
    <span class="who" sec:authorize="isAuthenticated()">
        <span sec:authentication="name"></span>
    </span>
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <button type="submit">Выйти</button>
    </form>
</nav>
</body>
</html>
