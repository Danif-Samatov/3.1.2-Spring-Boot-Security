<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<main class="page">
    <h1>Вход</h1>
    <p class="error" th:if="${param.error}">Неверное имя пользователя или пароль</p>
    <p class="ok" th:if="${param.logout}">Вы вышли из системы</p>
    <form class="card" th:action="@{/login}" method="post">
        <label>
            Логин
            <input type="text" name="username" required autofocus>
        </label>
        <label>
            Пароль
            <input type="password" name="password" required>
        </label>
        <button type="submit">Войти</button>
    </form>
    <p class="hint">admin / admin — роли ADMIN и USER. user / user — роль USER.</p>
</main>
</body>
</html>
